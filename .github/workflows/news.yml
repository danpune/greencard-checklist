name: Refresh news and check links
on:
  schedule:
    - cron: "17 12 * * *"   # daily ~8am ET: news.json
    - cron: "43 12 * * 1"   # Mondays: link check
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: news
jobs:
  news:
    if: github.event.schedule != '43 12 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6 (SHA-pinned)
        with:
          python-version: "3.12"   # ubuntu-latest moves to Ubuntu 26 on 2026-10-19; keep the scripts on a known Python
      - run: python3 update_news.py
      # one script failing must not stop the other, or the commit; the run still ends red
      - if: ${{ !cancelled() }}
        run: python3 update_officials.py
      - if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json officials.json
          git diff --cached --quiet || (git commit -m "Refresh news and officials" && git push)
  links:
    if: github.event.schedule != '17 12 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6 (SHA-pinned)
        with:
          python-version: "3.12"   # ubuntu-latest moves to Ubuntu 26 on 2026-10-19; keep the scripts on a known Python
      - run: python3 check_links.py
