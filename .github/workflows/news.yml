name: Refresh news and check links
on:
  schedule:
    - cron: "17 12 * * *"   # daily ~8am ET: news.json
    - cron: "43 12 * * 1"   # Mondays: link check
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: news
jobs:
  news:
    if: github.event.schedule != '43 12 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_news.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Refresh news.json" && git push)
  links:
    if: github.event.schedule != '17 12 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 check_links.py
