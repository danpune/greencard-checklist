<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Green Card Checklist: stats</title>
<style>
body{margin:0;padding:24px 16px;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f6f4ef;color:#1c2430}
@media (prefers-color-scheme: dark){body{background:#10151c;color:#e7ebf0}}
main{max-width:520px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:15px;margin:22px 0 6px;opacity:.7}
p{margin:0 0 8px;font-size:14px;opacity:.75}
table{width:100%;border-collapse:collapse}
td{padding:7px 0;border-top:1px solid rgba(128,128,128,.25)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
</style>
</head>
<body>
<main>
<h1>Green Card Checklist: stats</h1>
<p>Anonymous running totals. Visits count once per browser session. No cookies and no personal data.</p>
<div id="out"></div>
</main>
<script>
var groups = [
  ['Visits', [['visits', 'All visits'], ['quiz', 'Practice test page opened'], ['quiz-mock', 'Mock tests finished'], ['quiz-english', 'Reading and writing practice opened'], ['quiz-play', 'Auto-play started'], ['quiz-interview', 'Interview practice opened']]],
  ['Where visits came from', [['src-direct', 'Typed or no referrer'], ['src-wa', 'WhatsApp share'], ['src-link', 'Copied link'], ['src-search', 'Search engine'], ['src-social', 'Social or video site'], ['src-github', 'GitHub'], ['src-site', 'Another page on this site'], ['src-other', 'Other site']]],
  ['Sections where someone checked an item', [['tick-first-week', 'First week'], ['tick-work', 'Work'], ['tick-ids', 'IDs'], ['tick-travel', 'Travel'], ['tick-money', 'Money'], ['tick-citizenship', 'Citizenship']]]
];
var out = document.getElementById('out');
groups.forEach(function(g){
  var h = document.createElement('h2'); h.textContent = g[0]; out.appendChild(h);
  var t = document.createElement('table'); out.appendChild(t);
  g[1].forEach(function(k){
    var r = t.insertRow(), v = r.insertCell(); v.textContent = k[1];
    var n = r.insertCell(); n.textContent = '…';
    fetch('https://abacus.jasoncameron.dev/get/danpune-greencard-checklist/' + k[0])
      .then(function(x){ if (x.status === 404) return { value: 0 }; if (!x.ok) throw 0; return x.json(); })   // a key nobody has hit yet is a 404
      .then(function(d){ n.textContent = (d.value || 0).toLocaleString(); })
      .catch(function(){ n.textContent = '?'; });
  });
});
</script>
</body>
</html>
